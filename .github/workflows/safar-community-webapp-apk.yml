name: Build Safar Curated Web App APK

on:
  workflow_dispatch:
    inputs:
      web_app_url:
        description: "HTTPS URL of the deployed Safar Curated Community web app (must include /community)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-webapp-apk:
    name: Package community web app for Android
    runs-on: ubuntu-latest
    steps:
      - name: Validate target URL
        env:
          WEB_APP_URL: ${{ inputs.web_app_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ["WEB_APP_URL"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc or "/community" not in parsed.path:
              raise SystemExit("Provide the deployed HTTPS Community web-app URL, including /community.")
          print("Packaging web app URL:", url)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android WebView wrapper
        env:
          WEB_APP_URL: ${{ inputs.web_app_url }}
        run: |
          mkdir -p app/src/main/java/com/safarcurated/community app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SafarCuratedCommunity"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.safarcurated.community'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.safarcurated.community'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
                  buildConfigField 'String', 'WEB_APP_URL', '"' + (System.getenv('WEB_APP_URL') ?: '') + '"'
              }
              buildFeatures { buildConfig true }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/AppTheme" android:label="Safar Curated" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#173e30</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#0c211b</item>
              <item name="android:navigationBarColor">#0c211b</item>
            </style>
          </resources>
          EOF
          cat > app/src/main/java/com/safarcurated/community/MainActivity.java <<'EOF'
          package com.safarcurated.community;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.graphics.Color;
          import android.widget.Toast;
          import android.webkit.WebResourceRequest;
          import android.net.Uri;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;
          import android.content.Context;
          import android.webkit.CookieManager;
          import android.os.Message;

          public class MainActivity extends Activity {
            private WebView webView;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().setStatusBarColor(Color.rgb(12,33,27));
              getWindow().setNavigationBarColor(Color.rgb(12,33,27));
              webView = new WebView(this);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setSupportMultipleWindows(false);
              settings.setJavaScriptCanOpenWindowsAutomatically(false);
              settings.setLoadsImagesAutomatically(true);
              CookieManager.getInstance().setAcceptCookie(true);
              CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
              webView.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  Uri uri = request.getUrl();
                  if ("https".equals(uri.getScheme()) && uri.getHost() != null &&
                      (uri.getHost().equals(Uri.parse(BuildConfig.WEB_APP_URL).getHost()) ||
                       uri.getHost().endsWith(".vercel.app"))) return false;
                  if ("http".equals(uri.getScheme()) || "https".equals(uri.getScheme())) {
                    try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); } catch (ActivityNotFoundException ignored) {}
                    return true;
                  }
                  return false;
                }
              });
              webView.setWebChromeClient(new WebChromeClient());
              setContentView(webView);
              webView.loadUrl(BuildConfig.WEB_APP_URL);
            }
            @Override public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          EOF
          echo "org.gradle.java.home=" >> gradle.properties
          echo "WEB_APP_URL=$WEB_APP_URL" >> $GITHUB_ENV

      - name: Build debug APK
        env:
          WEB_APP_URL: ${{ inputs.web_app_url }}
        run: |
          ./gradlew --version >/dev/null 2>&1 || true
          gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: safar-curated-community-webapp-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
